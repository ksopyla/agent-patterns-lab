services:
  agent:
    build:
      context: ../..
      dockerfile: infra/docker/base/Dockerfile.agent
      args:
        PACKAGE_NAME: example-01-orchestrator-pipeline
        EXAMPLE_PYPROJECT: examples/01-orchestrator-pipeline/pyproject.toml
        EXAMPLE_SRC: examples/01-orchestrator-pipeline/src/
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      - VERBOSE=${VERBOSE:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
