[project]
name = "example-02-mcp-tool-integration"
version = "0.1.0"
description = "Pattern 02: MCP Tool Integration -- standardized tool access via Model Context Protocol"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-mcp-adapters>=0.2",
    "langsmith>=0.3",
    "mcp>=1.0",
    "duckduckgo-search>=8.0",
    "ddgs>=7.0",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "httpx>=0.28",
    "agent-common",
]

[tool.uv.sources]
agent-common = { workspace = true }
