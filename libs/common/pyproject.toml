[project]
name = "agent-common"
version = "0.1.0"
description = "Shared utilities for agent-patterns-lab: LLM config, tracing, verbose logging"
requires-python = ">=3.14"
dependencies = [
    "langsmith>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph-checkpoint-postgres",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "psycopg[binary,pool]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_common"]
