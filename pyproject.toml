[project]
name = "agent-patterns-lab"
version = "0.1.0"
description = "Practical design patterns, protocols, and architectures for real-world AI agents"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

[tool.uv.workspace]
members = ["libs/*", "examples/*"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["examples", "libs"]
addopts = "--tb=short -q --cov=examples --cov=libs --cov-report=term-missing --cov-report=xml --import-mode=importlib"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]
